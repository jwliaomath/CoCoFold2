name: Public CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
          python -m pip check
      - name: Test independent public copy
        run: python tests/run_public_tests.py --output results/cpu
      - name: Test two real CPU processes
        run: python tests/run_parallel_tests.py --output results/gloo
      - name: Build public source archive
        run: python tools/build_public_release.py --output results/release
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-cpu-reports
          path: |
            results/cpu/*.json
            results/cpu/*.xml
            results/cpu/*.log
            results/cpu/*.md
            results/gloo/summary.json
            results/gloo/gloo.log
            results/release/manifest.json
